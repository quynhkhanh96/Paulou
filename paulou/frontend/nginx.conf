server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API: no CORS, and the browser sees one host, so
    # http://localhost counts as a secure context for the microphone.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 180s;      # sentence preparation can take ~16 s (D52)
        client_max_body_size 16m;     # recordings
    }

    location / {
        try_files $uri /index.html;
    }
}
